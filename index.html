<style>
:root{--navy:#071b33;--blue:#0d5cab;--cyan:#19b7d8;--bg:#eef4fa;--green:#138a50;--red:#c63c3c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071b33 0,#123d66 230px,var(--bg) 230px);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;color:#10243a}
.app{max-width:720px;margin:auto;padding:18px 14px 40px}.top{color:#fff;padding:8px 4px 18px}.brand{font-weight:900;letter-spacing:.5px;font-size:20px}.tag{color:#bdeeff;font-size:13px;margin-top:4px}.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 12px 32px #001a3320}
.hero{width:100%;height:220px;object-fit:cover;background:#dce8f2;display:block}.hero-fallback{height:220px;background:linear-gradient(135deg,#12395f,#0b789b);display:grid;place-items:center;color:white;font-size:64px}
.content{padding:20px}.pill{display:inline-block;background:#e5f5ff;color:#07548a;padding:6px 11px;border-radius:30px;font-size:12px;font-weight:800}
h1{font-size:23px;line-height:1.35;margin:12px 0 8px}.question{font-size:18px;line-height:1.55;font-weight:750;margin:16px 0}
.options{display:grid;gap:10px}.option{width:100%;border:1.5px solid #d8e2ec;border-radius:13px;background:#fff;padding:13px;text-align:left;display:flex;gap:12px;align-items:center;font:inherit;font-size:15px;color:#17324d;cursor:pointer;transition:.15s}
.option:active{transform:scale(.99)}.letter{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:#eaf2fa;font-weight:900;color:#164d7c}
.option.correct{border-color:var(--green);background:#eaf8f0}.option.wrong{border-color:var(--red);background:#fff0f0}
.option:disabled{cursor:default}.feedback{margin-top:15px;padding:14px;border-radius:13px;line-height:1.5;display:none}.feedback.show{display:block}.feedback.good{background:#eaf8f0;color:#075c32}.feedback.bad{background:#fff1ef;color:#8e2424}
.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff;flex:1}.secondary{background:#e9f0f7;color:#174268}
.meta{display:flex;justify-content:space-between;color:#62768a;font-size:13px;margin:14px 2px 0}.bar{height:7px;background:#e5edf5;border-radius:10px;overflow:hidden;margin-top:8px}.fill{height:100%;width:0;background:linear-gradient(90deg,#0d5cab,#19b7d8);transition:.25s}
.footer{text-align:center;color:#d5e9f7;font-size:12px;margin-top:18px}.result{text-align:center;padding:28px 18px}.score{font-size:46px;font-weight:900;color:#0d5cab}.small{font-size:13px;color:#657b8f}
@media(min-width:600px){.hero{height:280px}.content{padding:26px}.question{font-size:20px}}
</style>

let index=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){
 const item=quiz[index];answered=false;
 $("category").textContent=item.cat.toUpperCase()+" · ELECTRICAL QUIZ";
 $("count").textContent=`प्रश्न ${index+1} / ${quiz.length}`;
 $("score").textContent=`स्कोर: ${score}`;
 $("progress").style.width=`${index/quiz.length*100}%`;
 $("question").textContent=item.q;
 $("options").innerHTML="";
 $("feedback").className="feedback";$("feedback").textContent="";
 $("next").disabled=true;$("next").textContent=index===quiz.length-1?"परिणाम देखें":"अगला सवाल →";
 item.o.forEach((label,i)=>{
  const b=document.createElement("button");b.className="option";b.type="button";
  b.innerHTML=`<span class="letter">${"ABCD"[i]}</span><span></span>`;b.querySelector("span:last-child").textContent=label;
  b.addEventListener("click",()=>choose(i));$("options").appendChild(b);
 });
}
function choose(i){
 if(answered)return;answered=true;const item=quiz[index];
 [...$("options").children].forEach((b,n)=>{b.disabled=true;if(n===item.a)b.classList.add("correct");else if(n===i)b.classList.add("wrong")});
 const good=i===item.a;if(good)score++;
 $("score").textContent=`स्कोर: ${score}`;
 $("feedback").className="feedback show "+(good?"good":"bad");
 $("feedback").innerHTML=`<strong>${good?"✓ बिल्कुल सही!":"✕ सही जवाब: "+ "ABCD"[item.a]}</strong><br>${item.e}`;
 $("next").disabled=false;
}
$("next").addEventListener("click",()=>{
 if(!answered)return;
 if(index<quiz.length-1){index++;render()}else{
  $("quizCard").innerHTML=`<div class="result"><div class="pill">QUIZ COMPLETE</div><h1>शानदार प्रयास! ⚡</h1><div class="score">${score} / ${quiz.length}</div><p>आपका Electrical Knowledge Score</p><p class="small">और सवालों की प्रैक्टिस करते रहिए।</p><button class="btn primary" id="again">दोबारा खेलें</button></div>`;
  document.getElementById("again").addEventListener("click",()=>location.reload());
 }
});
$("restart").addEventListener("click",()=>{index=0;score=0;render()});
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
